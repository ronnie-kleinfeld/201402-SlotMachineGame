name: GotchaSlots.ios
options:
  bundleIdPrefix: com.gotchaslots
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  GotchaSlots.ios:
    type: application
    platform: iOS
    sources:
      # NOTE: the on-disk folder is "GotchaSlotsApp", not "GotchaSlots.ios" — XcodeGen's source
      # globbing appears to treat a dotted directory name as a file reference rather than a
      # folder to recurse into (its Sources build phase came back completely empty when this
      # was pointed at a literal "GotchaSlots.ios" directory). The dot is fine in the target/
      # product/scheme name below since those are just strings, not filesystem paths.
      - path: GotchaSlotsApp
    resources:
      - path: GotchaSlotsApp/Resources
      - path: GotchaSlots.storekit
    info:
      path: GotchaSlotsApp/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gotchaslots.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: true
        # Swift module names can't contain "." — the product/target name stays "GotchaSlots.ios"
        # everywhere else (app name, .xcodeproj, scheme), but `import`/`@testable import` uses
        # this instead.
        PRODUCT_MODULE_NAME: GotchaSlotsIOS

  GotchaSlotsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GotchaSlotsTests
    dependencies:
      - target: GotchaSlots.ios
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

schemes:
  GotchaSlots.ios:
    build:
      targets:
        GotchaSlots.ios: all
        GotchaSlotsTests: [test]
    test:
      targets:
        - GotchaSlotsTests
    run:
      config: Debug
      storeKitConfiguration: GotchaSlots.storekit
