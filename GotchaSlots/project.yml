name: GotchaSlots
options:
  bundleIdPrefix: com.gotchaslots
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  GotchaSlots:
    type: application
    platform: iOS
    sources:
      - path: GotchaSlots
    resources:
      - path: GotchaSlots/Resources
    info:
      path: GotchaSlots/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gotchaslots.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: true

  GotchaSlotsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GotchaSlotsTests
    dependencies:
      - target: GotchaSlots
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

schemes:
  GotchaSlots:
    build:
      targets:
        GotchaSlots: all
        GotchaSlotsTests: [test]
    test:
      targets:
        - GotchaSlotsTests
    run:
      config: Debug
      storeKitConfiguration: GotchaSlots.storekit
